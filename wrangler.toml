name = "hono-dp"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Static Assets (Frontend 1:1 servido diretamente pelo Edge)
[assets]
directory = "./public"
binding = "ASSETS"

# Cloudflare D1 (Banco Relacional Serverless)
[[d1_databases]]
binding = "DB"
database_name = "hono-dp-db"
database_id = "local-d1-db"
migrations_dir = "./migrations"

# Cloudflare KV (Cache de Regras, Rate Limiting e Cache FiveM)
[[kv_namespaces]]
binding = "KV"
id = "local-kv-id"

# Variáveis de Ambiente
[vars]
ENVIRONMENT = "development"
DEMO_MODE = "true"
JWT_SECRET = "distrito-paulista-rp-super-secret-jwt-key-2026"
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
TURNSTILE_SECRET_KEY = "1x0000000000000000000000000000000AA"
FIVEM_SERVER_ENDPOINT = "https://servers-frontend.fivem.net/api/servers/single/distritopaulistarp"
